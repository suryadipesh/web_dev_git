
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Flexbox Layout</title>
    <style>
nav {
    background-color: #333;
    color: white;
    padding: 15px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.links {
    display: flex;
    gap: 20px;
}

.links a {
    color: white;
    text-decoration: none;
}

main {
    padding: 30px;
}

.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    background-color: lightblue;
    padding: 20px;
    flex: 1 ;
    border-radius: 8px;
}
    </style>
</head>

<body>

    <nav>
        <h2>My Website</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>

        <h1>My Projects</h1>

        <div class="card-container">

            <div class="card">
                <h2>HTML</h2>
                <p>HTML is used to create webpages.</p>
            </div>

            <div class="card">
                <h2>CSS</h2>
                <p>CSS is used to design webpages.</p>
            </div>

            <div class="card">
                <h2>JavaScript</h2>
                <p>JavaScript makes webpages interactive.</p>
            </div>

        </div>

    </main>

</body>
</html>
