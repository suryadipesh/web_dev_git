
<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Header and Footer</title>
    <style>
        header {
            background-color: crimson;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav {
            display: flex;
            gap: 25px;
        }

        a {
            color: white;
            text-decoration: none;
        }
        footer {
            background-color: crimson;
            color: white;
            padding: 25px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

    </style>
</head>

<body>

    <header>
        <h2>My Portfolio</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Portfolio</h1>
        <p>I am a web development student.</p>
    </main>

    <footer>
        <p>© 2026 My Portfolio</p>

        <div class="social">
            <a href="#">Instagram</a>
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
